# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: |
          set -o pipefail
          ./gradlew build 2>&1 | tee build-output.txt
      - name: include failure diagnostics in check summary
        if: failure()
        run: |
          echo '### Gradle diagnostics' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tail -n 250 build-output.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PYLOG'
          import pathlib
          lines=pathlib.Path('build-output.txt').read_text(errors='replace').splitlines()
          interesting=[]
          for i,line in enumerate(lines):
              if ' error: ' in line:
                  interesting.extend(lines[i:i+6])
          details='\n'.join(interesting)[:12000]
          details=details.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print('::error title=Compiler details::'+details)
          PYLOG
          for jar in $(find .gradle "$HOME/.gradle/caches" -name '*.jar' -size +8M 2>/dev/null); do
            if unzip -Z1 "$jar" 2>/dev/null | grep -q '^net/minecraft/client/multiplayer/MultiPlayerGameMode.class$'; then
              echo "::notice title=Game mode class::${jar}"
              javap -classpath "$jar" net.minecraft.client.multiplayer.MultiPlayerGameMode | grep -iE 'click|inventory|container|slot|swap' | while read -r method; do
                echo "::notice title=Game mode method::$method"
              done
              break
            fi
          done
      - name: run client game tests in virtual display
        run: |
          set -o pipefail
          timeout 420s xvfb-run -a ./gradlew runClientGameTest --no-configuration-cache 2>&1 | tee game-test-output.txt
      - name: summarize client test failure
        if: failure()
        run: |
          python3 - <<'PYLOG'
          from pathlib import Path
          text=Path('game-test-output.txt').read_text(errors='replace') if Path('game-test-output.txt').exists() else 'no client test log'
          lines=text.splitlines()
          needles=('AssertionError','Exception','ERROR','FAILED','FAILURE','Caused by','missing:', 'failed:', 'Test failed', 'BUILD FAILED')
          selected=[line for line in lines if any(word in line for word in needles)]
          excerpt='\n'.join(selected[-25:]+['--- end of output ---']+lines[-12:])[-3500:]
          print('::error title=Client gametest diagnostics::'+excerpt.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PYLOG
          find . -path '*/logs/latest.log' -maxdepth 6 -print -exec tail -n 90 {} \; 2>/dev/null || true
      - name: collect tested GUI screenshot
        run: |
          shot=$(find . -type f -name 'lauua-gui-preview.png' -print -quit)
          if [ -n "$shot" ]; then
            echo "Screenshot from virtual client: $shot"
            if [ "$shot" != './build/libs/lauua-gui-preview.png' ]; then cp "$shot" build/libs/lauua-gui-preview.png; fi
          else
            echo "::warning title=GUI screenshot missing::No screenshot saved by client gametest"
          fi
          worldshot=$(find . -type f -name 'lauua-live-esp.png' -print -quit)
          if [ -n "$worldshot" ] && [ "$worldshot" != './build/libs/lauua-live-esp.png' ]; then cp "$worldshot" build/libs/lauua-live-esp.png; fi
          settings=$(find . -type f -name 'lauua-storage-settings.png' -print -quit)
          if [ -n "$settings" ]; then
            if [ "$settings" != './build/libs/lauua-storage-settings.png' ]; then cp "$settings" build/libs/lauua-storage-settings.png; fi
          else
            echo "::warning title=Settings screenshot missing::No settings screenshot saved by client gametest"
          fi
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/

  publish-preview:
    # Direct JAR alternative when Chrome blocks the Actions artifact ZIP.
    if: github.event_name == 'push' && github.ref == 'refs/heads/arena/f86872cf-lauua' && (contains(github.event.head_commit.message, '[release]') || contains(github.event.head_commit.message, '[preview]'))
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: download compiled JARs
        uses: actions/download-artifact@v4
        with:
          name: Artifacts
          path: artifact
      - name: checksum distributable
        run: |
          test -s artifact/lauuacheats-1.2.0.jar
          cd artifact
          sha256sum lauuacheats-1.2.0.jar > SHA256SUMS
      - name: publish experimental release
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_ONLY: ${{ contains(github.event.head_commit.message, '[preview]') }}
        run: |
          if [ "$PREVIEW_ONLY" = 'true' ]; then
            test -s artifact/lauua-gui-preview.png
            gh release upload lauuacheats-v1.2.0-experimental artifact/lauua-gui-preview.png \
              --repo "${{ github.repository }}" --clobber
            exit 0
          fi
          assets=(artifact/lauuacheats-1.2.0.jar artifact/SHA256SUMS)
          if [ -s artifact/lauua-gui-preview.png ]; then assets+=(artifact/lauua-gui-preview.png); fi
          if [ -s artifact/lauua-storage-settings.png ]; then assets+=(artifact/lauua-storage-settings.png); fi
          gh release create lauuacheats-v1.2.0-experimental "${assets[@]}" \
            --repo "${{ github.repository }}" --target "$GITHUB_SHA" --prerelease \
            --title "Lauua Cheats 1.2.0 (experimental)" \
            --notes "Minecraft 26.2 client-only Fabric mod. Built with Java 25 by GitHub Actions from this release's source commit. CI client gametest covers storage/spawner/ore/portal indexing, live updates, chunk unload invalidation, GUI navigation/settings and screenshots in a disposable singleplayer world. Render output on diverse graphics stacks, multiplayer and other modules are NOT fully tested; inspect the source and verify SHA256SUMS before using."

  inspect-gui:
    # Temporary real-client visual review, removed before release.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[inspect]')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Artifacts
          path: artifact
      - name: share in-world screenshot blob ID
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -s artifact/lauua-live-esp.png
          python3 - <<'PYBLOB'
          import base64,json
          from pathlib import Path
          Path('blob.json').write_text(json.dumps({'encoding':'base64','content':base64.b64encode(Path('artifact/lauua-live-esp.png').read_bytes()).decode()}))
          PYBLOB
          sha=$(gh api -X POST "repos/${{ github.repository }}/git/blobs" --input blob.json --jq .sha)
          echo "::notice title=World ESP screenshot blob::${sha}"
